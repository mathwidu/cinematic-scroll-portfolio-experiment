version: "3.9"

services:
  web:
    image: ghcr.io/mathwidu/cinematic-scroll-portfolio-experiment:staging-latest
    networks:
      - network_swarm_public
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: stop-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.cinematic-scroll-portfolio.rule=Host(`cinematic-scroll.matheusduarte.dev.br`)
        - traefik.http.routers.cinematic-scroll-portfolio.entrypoints=websecure
        - traefik.http.routers.cinematic-scroll-portfolio.tls.certresolver=letsencryptresolver
        - traefik.http.services.cinematic-scroll-portfolio.loadbalancer.server.port=80

networks:
  network_swarm_public:
    external: true
